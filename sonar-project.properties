sonar.projectKey=NicolasBernal1_WhatsDueTomorrow-Backed2
sonar.organization=wdt

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts
sonar.test.exclusions=**/*.spec.ts,**/*.e2e-spec.ts,**/test/**,**/Tests/**
sonar.exclusions=**/*.spec.ts,**/*.e2e-spec.ts,**/test/**,**/Tests/**

# CALCULO DE COVERAGE: excluye boilerplate sin logica real
# Los *.controller.ts se excluyen porque son pura delegacion (sin if/ternarios/&&/||
# propios, verificado archivo por archivo): TypeScript compila cada decorador
# (@Get, @Param, @Body, etc.) con un helper (__param/__decorate) que contiene una
# rama de deteccion de Reflect.decorate que nunca cambia en tiempo de ejecucion.
# Istanbul la cuenta como "condicion sin cubrir" para siempre, sin relacion con
# logica de negocio real, inflando artificialmente el gap de cobertura.
sonar.coverage.exclusions=\
  src/main.ts,\
  src/app.controller.ts,\
  src/app.module.ts,\
  src/app.service.ts,\
  **/*.module.ts,\
  **/*.controller.ts,\
  **/entities/**,\
  **/dtos/**,\
  **/common/**,\
  **/*.spec.ts,\
  **/*.e2e-spec.ts,\
  **/test/**,\
  **/Tests/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=WhatsDueTomorrow-Backed
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8
